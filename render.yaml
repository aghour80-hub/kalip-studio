services:
  - type: web
    name: kalip-studio
    runtime: static
    buildCommand: chmod +x build.sh && ./build.sh
    staticPublishPath: ./build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
